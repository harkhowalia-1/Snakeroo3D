<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snakeroo 3D</title><link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>:root{--fg:#fff}*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#3f8f2e;font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--fg);cursor:crosshair}
canvas{position:fixed;inset:0}.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;text-align:center;padding:16px}
h1{font-weight:900;font-size:clamp(44px,10vw,96px);line-height:1;background:linear-gradient(#ffe14d,#34c759);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 10px #0008)}
.d3{font-weight:900;font-size:clamp(20px,4vw,30px);letter-spacing:4px;opacity:.9;margin-top:-6px}
.panel{pointer-events:auto;cursor:default;background:#1d3b22a6;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffff26;border-radius:28px;padding:26px;box-shadow:0 20px 50px #0007;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:440px;width:100%}
.panel img{width:96px;border-radius:24px;box-shadow:0 8px 24px #0006}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chips span{background:#ffffff14;border-radius:999px;padding:5px 12px;font-size:14px}
.sub{font-size:clamp(18px,3.5vw,28px);text-shadow:0 3px 0 #1d4d16}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
a.b{cursor:pointer;font-weight:900;font-size:18px;padding:14px 22px;border-radius:16px;text-decoration:none;color:#0b1f10;background:linear-gradient(90deg,#34c759,#00c7be);border-bottom:5px solid #0a7a55;transition:transform .1s;flex:1;min-width:160px}a.b.g{}a.b:not(.g){background:#ffffff1f;color:#fff;border-color:#ffffff2a}a.b:active{transform:translateY(4px);border-bottom-width:2px}
.hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:26px;background:#0004;padding:6px 18px;border-radius:14px;text-shadow:0 2px 0 #0006}
.hint{position:fixed;bottom:14px;width:100%;text-align:center;font-size:16px;opacity:.85}.hint a{color:#fff}</style></head><body>
<canvas id="c"></canvas><div class="hud">🍎 <span id="s">0</span> · best <span id="h">0</span></div>
<div class="ui"><h1>SNAKEROO</h1><div class="d3">3D</div><div class="panel"><img src="icon.png" alt="Snakeroo 3D icon"><p class="sub">Born for iPhone, iPad &amp; Mac</p>
<div class="chips"><span>🐍 3D snakes</span><span>⚡ 6 power-ups</span><span>🎥 3 cameras</span><span>🚪 Adventure</span><span>🤖 CPU rival</span></div><div class="row" style="width:100%"><a class="b g" href="https://github.com/harkhowalia-1/Snakeroo3D/releases/latest/download/Snakeroo3D.dmg">▶ Mac</a><a class="b" href="https://github.com/harkhowalia-1/Snakeroo3D/releases/latest/download/Snakeroo3D.ipa">▶ iPhone / iPad</a></div></div></div>
<p class="hint">Move your mouse or finger — the snake follows. Eat apples, dodge your own tail! · <a href="https://github.com/harkhowalia-1/Snakeroo3D">GitHub</a></p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D;function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}rs();onresize=rs;
let m={x:W/2,y:H*0.75},s=[],len=40,ap=[],sc=0,best=+(localStorage.sr||0),shake=0,parts=[],blink=0;document.getElementById('h').textContent=best;
for(let i=0;i<len;i++)s.push({x:W/2,y:H*0.75+i*4});
const mv=e=>{const t=e.touches?e.touches[0]:e;m.x=t.clientX;m.y=t.clientY};addEventListener('mousemove',mv);addEventListener('touchmove',mv,{passive:true});addEventListener('touchstart',mv,{passive:true});
function apple(){ap.push({x:60+Math.random()*(W-120),y:80+Math.random()*(H-160),t:Math.random()*6})}for(let i=0;i<4;i++)apple();
const tufts=[...Array(90)].map(()=>({x:Math.random(),y:Math.random(),r:6+Math.random()*10}));
function grass(){x.fillStyle='#4f9a33';x.fillRect(0,0,W,H);for(let i=0;i<W;i+=60)for(let j=0;j<H;j+=60)if((i/60+j/60)%2<1){x.fillStyle='#56a238';x.fillRect(i,j,60,60)};x.fillStyle='#8a8580';for(let i=0;i<W;i+=30){x.fillRect(i+1,1,28,14);x.fillRect(i+1,H-15,28,14)}for(let j=0;j<H;j+=30){x.fillRect(1,j+1,14,28);x.fillRect(W-15,j+1,14,28)}
x.fillStyle='#2f7a22';for(const t of tufts){const a=t.x*W,b=t.y*H;x.beginPath();x.moveTo(a,b);x.lineTo(a+t.r/2,b-t.r*1.6);x.lineTo(a+t.r,b);x.fill()}}
function loop(){requestAnimationFrame(loop);const h=s[0],dx=m.x-h.x,dy=m.y-h.y,d=Math.hypot(dx,dy),sp=Math.min(d*0.12,9);
if(d>1){h.x+=dx/d*sp;h.y+=dy/d*sp}for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i],ex=b.x-a.x,ey=b.y-a.y,l=Math.hypot(ex,ey)||1;b.x=a.x+ex/l*4;b.y=a.y+ey/l*4}
for(let i=ap.length-1;i>=0;i--){const p=ap[i];if(Math.hypot(p.x-h.x,p.y-h.y)<30){ap.splice(i,1);apple();sc++;for(let k=0;k<6;k++)s.push({...s[s.length-1]});shake=8;
for(let k=0;k<18;k++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,l:1});document.getElementById('s').textContent=sc;if(sc>best){best=sc;localStorage.sr=best;document.getElementById('h').textContent=best}}}
if(sp>3)for(let i=30;i<s.length;i+=2)if(Math.hypot(s[i].x-h.x,s[i].y-h.y)<10){s.length=Math.max(40,i);sc=0;document.getElementById('s').textContent=0;shake=14;break}
x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}grass();
for(const p of ap){p.t+=.05;const y=p.y+Math.sin(p.t)*4;x.fillStyle='#0003';x.beginPath();x.ellipse(p.x,p.y+18,14,5,0,0,7);x.fill();
const g=x.createRadialGradient(p.x-6,y-6,2,p.x,y,18);g.addColorStop(0,'#ff8a7a');g.addColorStop(1,'#c4161c');x.fillStyle=g;x.beginPath();x.arc(p.x,y,16,0,7);x.fill();x.fillStyle='#2b8a1e';x.beginPath();x.ellipse(p.x+6,y-17,7,3.5,-.5,0,7);x.fill()}
for(let i=s.length-1;i>=0;i--){const q=s[i],r=22*(1-i/s.length*.75)+4;x.fillStyle=i%14<6&&i>4?'#ffd22e':(i%2?'#d9261c':'#e8392f');x.beginPath();x.arc(q.x,q.y,r,0,7);x.fill()}
const a=Math.atan2(dy,dx);x.translate(h.x,h.y);x.rotate(a);const hg=x.createRadialGradient(-6,-8,4,0,0,32);hg.addColorStop(0,'#ff6a5c');hg.addColorStop(1,'#b81c14');x.fillStyle=hg;x.beginPath();x.ellipse(4,0,34,28,0,0,7);x.fill();
if(Math.random()<.004)blink=8;for(const e of[-13,13]){x.fillStyle='#fff';x.beginPath();x.ellipse(12,e,11,blink>0?2:12,0,0,7);x.fill();if(!blink){x.fillStyle='#111';x.beginPath();x.arc(16,e,5.5,0,7);x.fill()}}blink=Math.max(0,blink-1);
if(Date.now()%1400<220){x.strokeStyle='#ff2a5a';x.lineWidth=3;x.beginPath();x.moveTo(36,0);x.lineTo(52,0);x.lineTo(58,-5);x.moveTo(52,0);x.lineTo(58,5);x.stroke()}x.restore();
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.l-=.03;if(p.l<=0){parts.splice(i,1);continue}x.fillStyle='rgba(255,210,46,'+p.l+')';x.beginPath();x.arc(p.x,p.y,4*p.l+1,0,7);x.fill()}}
loop();
</script></body></html>
